name: Sync Release Data
 
on:
push:
branches:
- principal
release:
types:
- published
- edited
workflow_dispatch:
 
permissions:
contents: read
pages: write
id-token: write
 
concurrency:
group: github-pages
cancel-in-progress: true
 
jobs:
build:
runs-on: ubuntu-latest
 
steps:
- name: Baixar repositorio
uses: actions/checkout@v4
 
- name: Configurar GitHub Pages
uses: actions/configure-pages@v5
 
- name: Preparar pasta dos Releases
env:
GH_TOKEN: ${{ github.token }}
run: |
set -e
 
rm -rf release-data
mkdir -p release-data
 
gh release list \
--limit 100 \
--json tagName,isDraft,isPrerelease \
--jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
| while read tag; do
echo "Processando Release: $tag"
 
gh release download "$tag" \
--pattern 'nd-*.json' \
--pattern 'bl-*.json' \
--dir release-data \
--clobber || true
done
 
echo "Arquivos preparados:"
find release-data -maxdepth 1 -type f -print
 
test -n "$(find release-data -maxdepth 1 -type f -name 'nd-*.json' -print -quit)"
test -n "$(find release-data -maxdepth 1 -type f -name 'bl-*.json' -print -quit)"
 
- name: Enviar artefato do GitHub Pages
uses: actions/upload-pages-artifact@v4
with:
path: .
 
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
 
runs-on: ubuntu-latest
needs: build
 
steps:
- name: Publicar GitHub Pages
id: deployment
uses: actions/deploy-pages@v4

O GitHub documenta que um workflow personalizado pode configurar Pages, enviar o conteúdo com upload-pages-artifact e depois implantar esse artefato com deploy-pages. A documentação também exige pages: write e id-token: write para o deploy. Usando fluxos de trabalho personalizados com páginas de GitHub A documentação da própria ação deploy-pages confirma o padrão de um job de deploy dependente do job que criou o artefato. GitHub - actions/deploy-pages

