name: Sync Release Data
 
on:
push:
branches:
- principal
 
release:
types:
- published
- edited
 
workflow_dispatch:
 
permissions:
contents: read
pages: write
id-token: write
 
concurrency:
group: github-pages
cancel-in-progress: true
 
jobs:
build:
runs-on: ubuntu-latest
 
steps:
- name: Baixar repositorio
uses: actions/checkout@v4
 
- name: Configurar GitHub Pages
uses: actions/configure-pages@v5
 
- name: Preparar dados dos Releases
env:
GH_TOKEN: ${{ github.token }}
run: |
set -e
 
echo "Preparando pasta release-data..."
rm -rf release-data
mkdir -p release-data
 
echo "Consultando Releases publicados..."
 
gh release list \
--limit 100 \
--json tagName,isDraft,isPrerelease \
--jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
| while read tag; do
 
echo "Processando Release: $tag"
 
gh release download "$tag" \
--pattern 'nd-*.json' \
--pattern 'bl-*.json' \
--dir release-data \
--clobber || true
 
done
 
echo "Conteudo final de release-data:"
find release-data -maxdepth 1 -type f -print
 
echo "Validando ND..."
test -n "$(find release-data -maxdepth 1 -type f -name 'nd-*.json' -print -quit)"
 
echo "Validando BL..."
test -n "$(find release-data -maxdepth 1 -type f -name 'bl-*.json' -print -quit)"
 
echo "ND e BL encontrados."
 
- name: Enviar site para GitHub Pages
uses: actions/upload-pages-artifact@v4
with:
path: .
 
deploy:
runs-on: ubuntu-latest
needs: build
 
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
 
steps:
- name: Publicar GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
