name: Sync Release Data
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/sync-release-data.yml'
  release:
    types: [published, edited, released, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true
jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current dashboard, not the old Release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download and validate official Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 <<'PY'
          import gzip, hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          repo=os.environ['GITHUB_REPOSITORY']
          folder=Path('release-data')
          if folder.exists():shutil.rmtree(folder)
          folder.mkdir()
          def api(endpoint):
              result=subprocess.run(['gh','api',endpoint],check=True,capture_output=True,text=True,timeout=180)
              return json.loads(result.stdout)
          releases=[]
          for page in range(1,1001):
              batch=api(f'repos/{repo}/releases?per_page=100&page={page}')
              if not isinstance(batch,list):raise ValueError('Resposta invalida da API de Releases')
              releases.extend(r for r in batch if not r.get('draft') and not r.get('prerelease'))
              if len(batch)<100:break
          else:raise ValueError('Limite de paginacao excedido')
          pattern=re.compile(r'^(nd|bl)[-_\s]+(?:20)?(\d{2})[-_\s]+(0[1-9]|1[0-2])\.json(\.gz)?$',re.I)
          selected={}
          for release in releases:
              assets=[]
              for page in range(1,1001):
                  batch=api(f'repos/{repo}/releases/{release["id"]}/assets?per_page=100&page={page}')
                  assets.extend(batch)
                  if len(batch)<100:break
              else:raise ValueError('Limite de paginacao de assets excedido')
              for asset in assets:
                  match=pattern.fullmatch(asset.get('name',''))
                  if not match or asset.get('state')!='uploaded':continue
                  kind,yy,mm,_=match.groups();kind=kind.lower();key=(yy+'-'+mm,kind)
                  score=(asset.get('updated_at') or asset.get('created_at') or '',int(asset['id']))
                  if key not in selected or score>selected[key][0]:selected[key]=(score,asset,release.get('tag_name',''))
          if not selected:raise ValueError('Nenhum ND/BL mensal publicado foi encontrado')
          competences={}
          for competence,kind in selected:competences.setdefault(competence,{})[kind]=f'{kind}-{competence}.json'
          missing=[key for key,pair in competences.items() if set(pair)!={'nd','bl'}]
          if missing:raise ValueError('Pares ND/BL incompletos: '+', '.join(sorted(missing)))
          revision=hashlib.sha256();audit=[]
          for (competence,kind),(_,asset,tag) in sorted(selected.items()):
              target=folder/f'{kind}-{competence}.json'
              temporary=folder/(str(asset['id'])+'.download')
              with temporary.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/releases/assets/{asset["id"]}',
                                  '-H','Accept: application/octet-stream'],stdout=stream,check=True,timeout=600)
              raw=temporary.read_bytes()
              if asset['name'].lower().endswith('.gz'):raw=gzip.decompress(raw)
              payload=json.loads(raw.decode('utf-8-sig'))
              rows=payload if isinstance(payload,list) else payload.get('rows') if isinstance(payload,dict) else None
              if not isinstance(rows,list) or not rows or not all(isinstance(row,dict) for row in rows):
                  raise ValueError(asset['name']+': JSON sem lista valida de registros')
              if isinstance(payload,dict) and payload.get('type') and str(payload['type']).upper()!=kind.upper():
                  raise ValueError(asset['name']+': tipo ND/BL divergente do nome')
              target.write_bytes(raw);temporary.unlink()
              revision.update(target.name.encode());revision.update(hashlib.sha256(raw).digest())
              audit.append({'file':target.name,'release':tag,'asset_id':asset['id'],'updated_at':asset.get('updated_at'),'rows':len(rows)})
              print(target.name,':',len(rows),'registros; Release',tag)
          manifest={'version':1,'updated_at':datetime.now(timezone.utc).isoformat(),
                    'revision':revision.hexdigest(),'latest':max(competences),
                    'competences':dict(sorted(competences.items())),'sources':audit}
          (folder/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Manifesto validado. Competencias:',', '.join(sorted(competences)))
          PY
      - name: Validate and copy official index without modification
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q 'OFFICIAL BUILD: V64-P14' index.html
          grep -q '"COD_MUNICIPIO":"4101101"' index.html
          grep -q '"CIDADES":"Andirá"' index.html
          test "$(grep -o 'async function loadGitHubReleaseAssets()' index.html | wc -l)" -eq 1
          rm -rf _site
          mkdir -p _site/release-data
          cp index.html _site/index.html
          cmp -s index.html _site/index.html
      - name: Copy validated data to Pages
        shell: bash
        run: |
          set -euo pipefail
          cp -R release-data/. _site/release-data/
          if [ -d "reference-data" ]; then
            mkdir -p _site/reference-data
            cp -R reference-data/. _site/reference-data/
          fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/release-data/manifest.json
          grep -q '"26-11"' _site/release-data/manifest.json
          cmp -s index.html _site/index.html
      - name: Make exact published package available for audit
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-oficial-publicado
          path: _site
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
