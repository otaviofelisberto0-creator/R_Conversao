name: Sync Release Data

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync ND and BL from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            echo "Processing release: $tag"

            gh release download "$tag" \
              --pattern 'nd-*.json' \
              --pattern 'bl-*.json' \
              --dir release-data \
              --clobber || true
          done

          echo "Files synchronized:"
          find release-data -maxdepth 1 -type f -print || true

          if ! find release-data -maxdepth 1 -type f -name 'nd-*.json' -print -quit >/dev/null; then
            echo "Error: no nd-*.json files found in release-data"
            exit 1
          fi

          if ! find release-data -maxdepth 1 -type f -name 'bl-*.json' -print -quit >/dev/null; then
            echo "Error: no bl-*.json files found in release-data"
            exit 1
          fi

          echo "ND and BL found."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: release-data

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
