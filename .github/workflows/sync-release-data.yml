name: Sync Release Data

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/sync-release-data.yml'
  release:
    types: [published, edited, released, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current dashboard, not the old Release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download and validate official Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 <<'PY'
          import gzip, hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          repo=os.environ['GITHUB_REPOSITORY']
          folder=Path('release-data')
          if folder.exists():shutil.rmtree(folder)
          folder.mkdir()
          def api(endpoint):
              result=subprocess.run(['gh','api',endpoint],check=True,capture_output=True,text=True,timeout=180)
              return json.loads(result.stdout)
          releases=[]
          for page in range(1,1001):
              batch=api(f'repos/{repo}/releases?per_page=100&page={page}')
              if not isinstance(batch,list):raise ValueError('Resposta invalida da API de Releases')
              releases.extend(r for r in batch if not r.get('draft') and not r.get('prerelease'))
              if len(batch)<100:break
          else:raise ValueError('Limite de paginacao excedido')
          pattern=re.compile(r'^(nd|bl)[-_\s]+(?:20)?(\d{2})[-_\s]+(0[1-9]|1[0-2])\.json(\.gz)?$',re.I)
          selected={}
          for release in releases:
              assets=[]
              for page in range(1,1001):
                  batch=api(f'repos/{repo}/releases/{release["id"]}/assets?per_page=100&page={page}')
                  assets.extend(batch)
                  if len(batch)<100:break
              else:raise ValueError('Limite de paginacao de assets excedido')
              for asset in assets:
                  match=pattern.fullmatch(asset.get('name',''))
                  if not match or asset.get('state')!='uploaded':continue
                  kind,yy,mm,_=match.groups();kind=kind.lower();key=(yy+'-'+mm,kind)
                  score=(asset.get('updated_at') or asset.get('created_at') or '',int(asset['id']))
                  if key not in selected or score>selected[key][0]:selected[key]=(score,asset,release.get('tag_name',''))
          if not selected:raise ValueError('Nenhum ND/BL mensal publicado foi encontrado')
          competences={}
          for competence,kind in selected:competences.setdefault(competence,{})[kind]=f'{kind}-{competence}.json'
          missing=[key for key,pair in competences.items() if set(pair)!={'nd','bl'}]
          if missing:raise ValueError('Pares ND/BL incompletos: '+', '.join(sorted(missing)))
          revision=hashlib.sha256();audit=[]
          for (competence,kind),(_,asset,tag) in sorted(selected.items()):
              target=folder/f'{kind}-{competence}.json'
              temporary=folder/(str(asset['id'])+'.download')
              with temporary.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/releases/assets/{asset["id"]}',
                                  '-H','Accept: application/octet-stream'],stdout=stream,check=True,timeout=600)
              raw=temporary.read_bytes()
              if asset['name'].lower().endswith('.gz'):raw=gzip.decompress(raw)
              payload=json.loads(raw.decode('utf-8-sig'))
              rows=payload if isinstance(payload,list) else payload.get('rows') if isinstance(payload,dict) else None
              if not isinstance(rows,list) or not rows or not all(isinstance(row,dict) for row in rows):
                  raise ValueError(asset['name']+': JSON sem lista valida de registros')
              if isinstance(payload,dict) and payload.get('type') and str(payload['type']).upper()!=kind.upper():
                  raise ValueError(asset['name']+': tipo ND/BL divergente do nome')
              target.write_bytes(raw);temporary.unlink()
              revision.update(target.name.encode());revision.update(hashlib.sha256(raw).digest())
              audit.append({'file':target.name,'release':tag,'asset_id':asset['id'],'updated_at':asset.get('updated_at'),'rows':len(rows)})
              print(target.name,':',len(rows),'registros; Release',tag)
          manifest={'version':1,'updated_at':datetime.now(timezone.utc).isoformat(),
                    'revision':revision.hexdigest(),'latest':max(competences),
                    'competences':dict(sorted(competences.items())),'sources':audit}
          (folder/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Manifesto validado. Competencias:',', '.join(sorted(competences)))
          PY

      - name: Correct complete index without replacing dashboard pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          from html.parser import HTMLParser

          LOADER = "// RELEASE_PAGES_FIX_V64_BEGIN\nasync function readPagesDataV64(url,kind){\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),120000);\n  try{\n    const response=await fetch(url,{cache:'no-store',credentials:'same-origin',signal:controller.signal});\n    if(!response.ok)throw new Error('HTTP '+response.status+' ao carregar '+url.pathname);\n    return kind==='json'?await response.json():await response.arrayBuffer();\n  }catch(error){\n    if(error.name==='AbortError')throw new Error('Tempo limite ao carregar '+url.pathname);\n    throw error;\n  }finally{clearTimeout(timer)}\n}\nasync function loadGitHubReleaseAssets(){\n  if(githubReleaseLoadRunning)return;\n  githubReleaseLoadRunning=true;\n  const button=$('#loadGitHubRelease'),overlay=$('#initialLoadOverlay');\n  if(button)button.disabled=true;\n  if(overlay)overlay.classList.remove('off');\n  initialLoadValue=0;\n  document.querySelector('#retryPagesV64')?.remove();\n  setInitialLoad(1,'Localizando bases dos Releases sincronizadas no Pages...',8);\n  setGitHubReleaseAudit('');\n  setGitHubReleaseStatus('Lendo manifesto publicado pelo sync...','processing');\n  try{\n    const manifestUrl=new URL('./release-data/manifest.json',location.href);\n    manifestUrl.searchParams.set('v',Date.now());\n    const manifest=await readPagesDataV64(manifestUrl,'json');\n    if(!manifest||manifest.version!==1||!manifest.competences||typeof manifest.competences!=='object')\n      throw new Error('Manifesto ausente ou com estrutura incompatível. Execute Sync Release Data.');\n    const keys=Object.keys(manifest.competences).sort();\n    if(!keys.length||!keys.includes(manifest.latest))throw new Error('Competência latest inválida no manifesto.');\n    for(const key of keys){\n      if(!/^\\d{2}-(0[1-9]|1[0-2])$/.test(key))throw new Error('Competência inválida: '+key);\n      const pair=manifest.competences[key];\n      for(const type of ['nd','bl']){\n        if(!pair||pair[type]!==type+'-'+key+'.json')throw new Error('Par ND/BL incompleto ou nome inválido em '+key);\n      }\n    }\n    setGitHubReleaseAudit(['Fonte oficial: GitHub Releases. Transporte: cópia sincronizada no Pages.',\n      'Última competência: '+manifest.latest,\n      ...keys.map(key=>key+': '+manifest.competences[key].nd+' + '+manifest.competences[key].bl)]);\n    setInitialLoad(2,'Baixando e processando ND e BL de todas as competências...',22);\n    let completed=0;\n    async function loadType(type){\n      const rows=[],months=new Set(),files=[];\n      let sourceRows=0,removed=0;\n      for(const key of keys){\n        const name=manifest.competences[key][type.toLowerCase()];\n        const url=new URL('./release-data/'+encodeURIComponent(name),location.href);\n        url.searchParams.set('v',manifest.revision||manifest.updated_at||Date.now());\n        const buffer=await readPagesDataV64(url,'buffer');\n        const parsed=await parseBaseBufferRows(type,buffer,name,0);\n        for(const row of parsed.rows)rows.push(row);\n        sourceRows+=Number(parsed.sourceRows)||0;removed+=Number(parsed.removed)||0;\n        months.add('20'+key);\n        files.push(name);\n        completed++;\n        setInitialLoad(2,'Processado '+name+' ('+completed+'/'+(keys.length*2)+')',22+Math.round(completed/(keys.length*2)*52));\n        await new Promise(resolve=>setTimeout(resolve,0));\n      }\n      const validation=validateBaseRows(type,rows);\n      if(!validation.valid)throw new Error(type+': '+validation.message);\n      return {type,rows,sourceRows,removed,months,files,sourceLabel:'GitHub Releases via sync/Pages'};\n    }\n    const results=await Promise.allSettled([loadType('ND'),loadType('BL')]);\n    const failed=results.find(result=>result.status==='rejected');\n    if(failed)throw failed.reason;\n    setInitialLoad(3,'Calculando indicadores, filtros e rankings...',82);\n    await new Promise(resolve=>setTimeout(resolve,0));\n    commitDashboardReleaseData(results[0].value,results[1].value);\n    setGitHubReleaseStatus('Carga concluída: '+keys.length+' competências, ND e BL sincronizados dos Releases.','success');\n    finishInitialLoad();\n  }catch(error){\n    console.error('Carga Pages/Release:',error);\n    dashboardReleaseReady=false;\n    const reason=error?.message||'Erro inesperado';\n    setInitialLoad(1,'Falha: '+reason);\n    setGitHubReleaseStatus('Falha na carga: '+reason,'error');\n    showAutomaticLoadError(reason);\n    const card=overlay?.querySelector('.initialLoadCard');\n    if(card){\n      const retry=document.createElement('button');retry.id='retryPagesV64';retry.type='button';\n      retry.className='action';retry.textContent='Tentar novamente';retry.style.marginTop='12px';\n      retry.addEventListener('click',()=>loadGitHubReleaseAssets());card.appendChild(retry);\n    }\n  }finally{githubReleaseLoadRunning=false;if(button)button.disabled=false}\n}\n// RELEASE_PAGES_FIX_V64_END\n"

          def patch_index(source):
              if '<html' not in source.lower() or '</html>' not in source.lower():
                  raise ValueError('index.html incompleto ou invalido')
              start_marker='// RELEASE_PAGES_FIX_V64_BEGIN'
              end_marker='// RELEASE_PAGES_FIX_V64_END'
              if start_marker in source:
                  a=source.index(start_marker)
                  b=source.index(end_marker,a)+len(end_marker)
              else:
                  token='async function loadGitHubReleaseAssets()'
                  if source.count(token)!=1:
                      raise ValueError('Versao nao reconhecida: esperado um loadGitHubReleaseAssets')
                  a=source.index(token)
                  b=source.index('$("#loadGitHubRelease").onclick',a)
              result=source[:a]+LOADER.rstrip()+'\n'+source[b:].lstrip('\n')
              if not re.search(r'function\s+cleanCriteriaKey\s*\(',result):
                  if re.search(r'(?:const|let|var)\s+cleanCriteriaKey\b',result):
                      raise ValueError('cleanCriteriaKey com declaracao inesperada: revisar manualmente')
                  match=re.search(r'<script\b[^>]*>',result,re.I)
                  if not match: raise ValueError('Script principal nao encontrado')
                  helper="\nfunction cleanCriteriaKey(value){return String(value??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/\\s+/g,' ').trim().toUpperCase()}\n"
                  result=result[:match.end()]+helper+result[match.end():]
              result=result.replace('rows.push(...parsed.rows);','for(const row of parsed.rows)rows.push(row);')
              result=result.replace('OFFICIAL BUILD: V63 |','OFFICIAL BUILD: V64 |')
              return result

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False); self.scripts=[];self.active=False;self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      attrs=dict(attrs);self.active=not attrs.get('src') and attrs.get('type','').lower() in ('','text/javascript','application/javascript','module');self.parts=[]
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.active:
                      self.scripts.append(''.join(self.parts));self.active=False

          def validate_scripts(html):
              parser=Scripts();parser.feed(html)
              if not parser.scripts:raise ValueError('Nenhum script executavel encontrado')
              with tempfile.TemporaryDirectory() as folder:
                  for i,script in enumerate(parser.scripts):
                      path=Path(folder)/('script-'+str(i)+'.js');path.write_text(script,encoding='utf-8')
                      subprocess.run(['node','--check',str(path)],check=True)

          if __name__=='__main__':
              import sys
              src=Path(sys.argv[1] if len(sys.argv)>1 else 'index.html')
              dst=Path(sys.argv[2] if len(sys.argv)>2 else '_site/index.html')
              result=patch_index(src.read_text(encoding='utf-8-sig'))
              validate_scripts(result)
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_text(result,encoding='utf-8')
              print('Index completo corrigido e sintaxe JavaScript validada:',dst)
          PY

      - name: Copy validated data to Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/release-data
          cp -R release-data/. _site/release-data/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/release-data/manifest.json

      - name: Make complete corrected index available for download
        uses: actions/upload-artifact@v4
        with:
          name: index-corrigido
          path: _site/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
