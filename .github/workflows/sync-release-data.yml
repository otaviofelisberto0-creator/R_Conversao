name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            > release-tags.txt

          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            echo "Processing release: $tag"

            gh release download "$tag" \
              --repo "${{ github.repository }}" \
              --pattern "nd-*.json" \
              --pattern "bl-*.json" \
              --dir release-data \
              --clobber || true

          done < release-tags.txt

          echo "Downloaded JSON files:"
          find release-data -maxdepth 1 -type f -name "*.json" -print

          json_count=$(find release-data -maxdepth 1 -type f -name "*.json" | wc -l)

          if [ "$json_count" -eq 0 ]; then
            echo "ERROR: No ND or BL JSON files found."
            exit 1
          fi

          echo "Total JSON files: $json_count"

      - name: Prepare dashboard site
        run: |
          set -euo pipefail

          if [ ! -f "index.html" ]; then
            echo "ERROR: Dashboard index.html was not found."
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="release-data/" \
            --exclude="release-tags.txt" \
            ./ _site/

          mkdir -p _site/release-data
          cp release-data/*.json _site/release-data/

          touch _site/.nojekyll

          echo "Dashboard:"
          ls -lh _site/index.html

          echo "JSON files:"
          ls -lh _site/release-data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
