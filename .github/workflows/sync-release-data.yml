name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync-release-data-${{ github.repository }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Synchronize release files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do
              if [ -z "$tag" ]; then
                continue
              fi

              echo "Processing release: $tag"

              gh release download "$tag" \
                --repo "${{ github.repository }}" \
                --pattern "nd-*.json" \
                --pattern "bl-*.json" \
                --dir release-data \
                --clobber || true
            done

          echo "JSON files found:"

          find release-data \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print

          json_count=$(
            find release-data \
              -maxdepth 1 \
              -type f \
              -name "*.json" |
            wc -l
          )

          if [ "$json_count" -eq 0 ]; then
            echo "ERROR: No JSON files were found in the Releases."
            exit 1
          fi

          echo "Total JSON files: $json_count"

      - name: Generate release index
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote

          folder = Path("release-data")
          files = sorted(folder.glob("*.json"))

          lt = chr(60)
          gt = chr(62)

          items = []

          for file in files:
              filename = file.name
              safe_name = escape(filename)
              file_url = quote(filename)
              size_mb = file.stat().st_size / (1024 * 1024)

              link = (
                  f'{lt}a href="./{file_url}" download{gt}'
                  f'{safe_name}'
                  f'{lt}/a{gt}'
              )

              item = (
                  f'{lt}li{gt}'
                  f'{link}'
                  f'{lt}span class="meta"{gt}'
                  f'{size_mb:.2f} MB'
                  f'{lt}/span{gt}'
                  f'{lt}/li{gt}'
              )

              items.append(item)

          page_start = f"""<!doctype html>
          {lt}html lang="pt-BR"{gt}
          {lt}head{gt}
            {lt}meta charset="utf-8"{gt}
            {lt}meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            {gt}

            {lt}title{gt}Bases ND e BL{lt}/title{gt}

            {lt}style{gt}
              body {{
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
                color: #24292f;
                background: #ffffff;
              }}

              h1 {{
                margin-bottom: 8px;
              }}

              p {{
                color: #57606a;
              }}

              ul {{
                list-style: none;
                padding: 0;
              }}

              li {{
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
                padding: 14px;
                margin-bottom: 8px;
                border: 1px solid #d0d7de;
                border-radius: 6px;
              }}

              a {{
                color: #0969da;
                text-decoration: none;
                font-weight: 600;
                overflow-wrap: anywhere;
              }}

              a:hover {{
                text-decoration: underline;
              }}

              .meta {{
                color: #57606a;
                font-size: 14px;
                white-space: nowrap;
              }}
            {lt}/style{gt}
          {lt}/head{gt}

          {lt}body{gt}
            {lt}h1{gt}Bases ND e BL{lt}/h1{gt}

            {lt}p{gt}
              Arquivos JSON sincronizados automaticamente das Releases.
            {lt}/p{gt}

            {lt}ul{gt}
          """

          page_end = f"""
            {lt}/ul{gt}
          {lt}/body{gt}
          {lt}/html{gt}
          """

          page = page_start + "\n".join(items) + page_end

          output = folder / "index.html"
          output.write_text(page, encoding="utf-8")

          print(f"Index generated with {len(files)} JSON file(s).")
          print(f"Output: {output}")

          for file in files:
              print(f"Published: {file.name}")
          PY

      - name: Show generated files
        run: |
          echo "Files prepared for GitHub Pages:"

          find release-data \
            -maxdepth 1 \
            -type f \
            -printf "%f - %s bytes\n"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: release-data

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
