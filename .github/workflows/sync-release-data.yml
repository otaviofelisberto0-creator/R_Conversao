name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            > release-tags.txt

          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            echo "Processing release: $tag"

            gh release download "$tag" \
              --repo "${{ github.repository }}" \
              --pattern "nd-*.json" \
              --pattern "bl-*.json" \
              --dir release-data \
              --clobber || true

          done < release-tags.txt

          echo "JSON files found:"

          find release-data \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print

          json_count=$(find release-data -maxdepth 1 -type f -name "*.json" | wc -l)

          if [ "$json_count" -eq 0 ]; then
            echo "ERROR: No JSON files were found in the Releases."
            exit 1
          fi

          echo "Total JSON files: $json_count"

      - name: Generate release-data index
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote

          folder = Path("release-data")
          files = sorted(folder.glob("*.json"))

          lt = chr(60)
          gt = chr(62)

          items = []

          for file in files:
              filename = file.name
              safe_name = escape(filename)
              file_url = quote(filename)
              size_mb = file.stat().st_size / (1024 * 1024)

              link = (
                  f'{lt}a href="./{file_url}" download{gt}'
                  f'{safe_name}'
                  f'{lt}/a{gt}'
              )

              item = (
                  f'{lt}li{gt}'
                  f'{link}'
                  f'{lt}span class="meta"{gt}'
                  f'{size_mb:.2f} MB'
                  f'{lt}/span{gt}'
                  f'{lt}/li{gt}'
              )

          
