name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do

              if [ -z "$tag" ]; then
                continue
              fi

              echo "Processing release: $tag"

              gh release download "$tag" \
                --repo "${{ github.repository }}" \
                --pattern "nd-*.json" \
                --pattern "bl-*.json" \
                --dir release-data \
                --clobber || true
            done

          echo "JSON files found:"

          find release-data \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print

          json_count=$(
            find release-data \
              -maxdepth 1 \
              
