name: Sincronizar Dados e Publicar Dashboard Oficial

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/sync-release-data.yml
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  OFFICIAL_BUILD: V71-SEGMENTO-MUNICIPIO-DIARIA
  # Este deve ser o unico workflow ativo que usa actions/deploy-pages.
  # Workflows antigos devem ser excluidos ou movidos para fora de .github/workflows.

concurrency:
  group: dashboard-oficial-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar index oficial e preparar dados
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Carregar sempre o codigo oficial da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validar estrutura minima do index sem bloquear atualizacao de dados
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q 'content="V71-SEGMENTO-MUNICIPIO-DIARIA"' index.html
          grep -q "const OFFICIAL_BUILD='V71-SEGMENTO-MUNICIPIO-DIARIA'" index.html
          grep -q 'id="dailySegmentoMunicipio"' index.html
          grep -q 'NM_SEGMENTO_MUNICIPIO' index.html
          grep -q '4101101' index.html

          # As verificacoes funcionais abaixo geram avisos, mas nao impedem
          # a sincronizacao diaria. O index publicado continua sendo sempre
          # o arquivo atual da branch main.
          check_marker() {
            local pattern="$1"
            local description="$2"
            if grep -Eq "$pattern" index.html; then
              echo "OK: $description"
            else
              echo "::warning::$description nao localizado no index atual da main."
            fi
          }

          check_marker 'OFFICIAL BUILD: V71-SEGMENTO-MUNICIPIO-DIARIA' 'Identificacao da versao oficial'
          check_marker "const OFFICIAL_BUILD='V71-SEGMENTO-MUNICIPIO-DIARIA'" 'Constante da versao oficial'
          check_marker 'CONVERSAO[[:space:]]*:[[:space:]]*80' 'Meta de Conversao 80%'
          check_marker 'INSTALACAO_48H[[:space:]]*:[[:space:]]*65' 'Meta de Instalacao 48h 65%'
          check_marker 'INSTALACAO_3_DIAS[[:space:]]*:[[:space:]]*78' 'Meta de Instalacao 3 dias 78%'
          check_marker '4101101' 'Cidade Andira codigo 4101101'
          check_marker 'id="asub"' 'Filtro Subcluster da Conversao'
          check_marker 'id="dailySubcluster"' 'Filtro Subcluster da Analise Diaria'
          check_marker 'id="dailySegmentoMunicipio"' 'Filtro Segmento Municipio da Analise Diaria'
          check_marker 'NM_SEGMENTO_MUNICIPIO' 'Campo Segmento Municipio preservado no conversor JSON'
          check_marker 'id="treeSubcluster"' 'Filtro Subcluster do Mes x Mes'

          echo 'OK: estrutura HTML valida. A atualizacao automatica pode continuar.'

      - name: Baixar e consolidar pares mensais ND e BL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-data
          mkdir -p release-data

          python3 <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          official_build = os.environ['OFFICIAL_BUILD']
          output = Path('release-data')
          pattern = re.compile(
              r'^(nd|bl)[-_ ]+(?:conversao[-_ ]+)?(?:20)?(\d{2})[-_ ]+(0[1-9]|1[0-2])\.json(?:\.gz)?$',
              re.I,
          )

          def gh_json(endpoint):
              process = subprocess.run(
                  ['gh', 'api', '--paginate', endpoint],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              text = process.stdout.strip()
              if not text:
                  return []

              decoder = json.JSONDecoder()
              position = 0
              values = []
              while position < len(text):
                  while position < len(text) and text[position].isspace():
                      position += 1
                  if position >= len(text):
                      break
                  value, position = decoder.raw_decode(text, position)
                  values.extend(value if isinstance(value, list) else [value])
              return values

          releases = [
              release
              for release in gh_json(f'repos/{repo}/releases?per_page=100')
              if not release.get('draft') and not release.get('prerelease')
          ]
          if not releases:
              raise SystemExit('ERRO: nenhum Release publicado foi localizado.')

          candidates = {}
          ignored_assets = []

          for release in releases:
              assets = gh_json(
                  f'repos/{repo}/releases/{release["id"]}/assets?per_page=100'
              )
              release_time = (
                  release.get('published_at')
                  or release.get('created_at')
                  or ''
              )

              for asset in assets:
                  name = asset.get('name', '')
                  match = pattern.fullmatch(name)
                  if not match or asset.get('state') != 'uploaded':
                      if name.lower().endswith(('.json', '.json.gz')):
                          ignored_assets.append(name)
                      continue

                  kind, year, month = match.groups()
                  kind = kind.lower()
                  competence = f'{year}-{month}'
                  score = (
                      release_time,
                      asset.get('updated_at') or '',
                      int(asset['id']),
                  )
                  key = (competence, kind)

                  if key not in candidates or score > candidates[key]['score']:
                      candidates[key] = {
                          'score': score,
                          'asset': asset,
                          'tag': release.get('tag_name', ''),
                      }

          competences = sorted({competence for competence, _ in candidates})
          complete = [
              competence
              for competence in competences
              if (competence, 'nd') in candidates
              and (competence, 'bl') in candidates
          ]
          incomplete = [
              competence for competence in competences if competence not in complete
          ]

          if not complete:
              raise SystemExit('ERRO: nenhum par mensal completo ND + BL foi localizado.')

          manifest_competences = {}
          sources = []
          revision = hashlib.sha256()

          for competence in complete:
              manifest_competences[competence] = {}

              for kind in ('nd', 'bl'):
                  selected = candidates[(competence, kind)]
                  asset = selected['asset']
                  temporary = output / f'.{asset["id"]}.tmp'

                  with temporary.open('wb') as stream:
                      subprocess.run(
                          [
                              'gh',
                              'api',
                              f'repos/{repo}/releases/assets/{asset["id"]}',
                              '-H',
                              'Accept: application/octet-stream',
                          ],
                          check=True,
                          stdout=stream,
                      )

                  raw = temporary.read_bytes()
                  temporary.unlink()
                  if asset['name'].lower().endswith('.gz'):
                      raw = gzip.decompress(raw)

                  try:
                      payload = json.loads(raw.decode('utf-8-sig'))
                  except Exception as error:
                      raise SystemExit(
                          f'ERRO: JSON invalido em {asset["name"]}: {error}'
                      )

                  rows = (
                      payload
                      if isinstance(payload, list)
                      else payload.get('rows')
                      if isinstance(payload, dict)
                      else None
                  )
                  if (
                      not isinstance(rows, list)
                      or not rows
                      or not all(isinstance(row, dict) for row in rows)
                  ):
                      raise SystemExit(
                          f'ERRO: {asset["name"]} nao possui registros JSON validos.'
                      )

                  filename = f'{kind}-{competence}.json'
                  target = output / filename
                  target.write_bytes(raw)
                  manifest_competences[competence][kind] = filename

                  file_hash = hashlib.sha256(raw).hexdigest()
                  revision.update(filename.encode('utf-8'))
                  revision.update(bytes.fromhex(file_hash))
                  sources.append(
                      {
                          'file': filename,
                          'rows': len(rows),
                          'release': selected['tag'],
                          'asset_id': asset['id'],
                          'sha256': file_hash,
                      }
                  )
                  print(
                      f'OK {filename}: {len(rows)} registros | '
                      f'release {selected["tag"]}'
                  )

          manifest = {
              'version': 1,
              'officialBuild': official_build,
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'revision': revision.hexdigest(),
              'latest': complete[-1],
              'competences': manifest_competences,
              'sources': sources,
              'ignored_incomplete_competences': incomplete,
              'ignored_assets': sorted(set(ignored_assets)),
          }

          (output / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          print('COMPETENCIAS PUBLICADAS:', ', '.join(complete))
          print('COMPETENCIA MAIS RECENTE:', complete[-1])
          if incomplete:
              print('INCOMPLETAS IGNORADAS:', ', '.join(incomplete))
          PY

      - name: Validar manifesto e pares ND BL
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('release-data/manifest.json').read_text(encoding='utf-8')
          )

          if manifest.get('officialBuild') != 'V71-SEGMENTO-MUNICIPIO-DIARIA':
              raise SystemExit('ERRO: build oficial divergente no manifesto.')

          latest = manifest.get('latest')
          competences = manifest.get('competences')
          if not latest or not isinstance(competences, dict):
              raise SystemExit('ERRO: manifesto sem latest ou competences.')

          for competence, pair in competences.items():
              if set(pair) != {'nd', 'bl'}:
                  raise SystemExit(
                      f'ERRO: competencia {competence} sem par ND + BL.'
                  )
              for filename in pair.values():
                  path = Path('release-data') / filename
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f'ERRO: arquivo ausente ou vazio: {path}')

          if latest not in competences:
              raise SystemExit('ERRO: latest nao existe em competences.')

          print('Manifesto valido. Mais recente:', latest)
          PY

      - name: Montar pacote oficial sem alterar o index
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/release-data

          cp index.html _site/index.html
          cp -R release-data/. _site/release-data/

          if [ -d reference-data ]; then
            mkdir -p _site/reference-data
            cp -R reference-data/. _site/reference-data/
          fi

          touch _site/.nojekyll
          cmp -s index.html _site/index.html
          test -s _site/release-data/manifest.json

          INDEX_SHA256=$(sha256sum index.html | awk '{print $1}')
          MANIFEST_SHA256=$(sha256sum _site/release-data/manifest.json | awk '{print $1}')

          cat > _site/version.json <<EOF
          {
            "official": true,
            "officialBuild": "${OFFICIAL_BUILD}",
            "sourceBranch": "main",
            "sourceCommit": "${GITHUB_SHA}",
            "workflowRun": "${GITHUB_RUN_ID}",
            "indexSha256": "${INDEX_SHA256}",
            "manifestSha256": "${MANIFEST_SHA256}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo 'OK: index copiado integralmente da branch main.'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Guardar pacote para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-oficial-${{ github.run_id }}
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Enviar pacote ao GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar pacote oficial
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
