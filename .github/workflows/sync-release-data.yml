name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync-release-data-${{ github.repository }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Synchronize release files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do
              if [ -z "$tag" ]; then
                continue
              fi

              echo "Processing release: $tag"

              gh release download "$tag" \
                --repo "${{ github.repository }}" \
                --pattern "nd-*.json" \
                --pattern "bl-*.json" \
                --dir release-data \
                --clobber || true
            done

          echo "JSON files found:"
          find release-data -maxdepth 1 -type f -name "*.json" -print

          json_count=$(find release-data -maxdepth 1 -type f -name "*.json" | wc -l)

          if [ "$json_count" -eq 0 ]; then
            echo "ERROR: No JSON files were found in the Releases."
            exit 1
          fi

          echo "Total JSON files: $json_count"

      - name: Generate release index
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from html import escape

          folder = Path("release-data")
          files = sorted(folder.glob("*.json"))

          items = []

          for file in files:
              name = escape(file.name)
              size_mb = file.stat().st_size / (1024 * 1024)

              items.append(
                  f'''
                  <li>
                    ./{name}{name}</a>
                    <span class="meta">{size_mb:.2f} MB</span>
                  </li>
                  '''
              )

          page = """<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Bases ND e BL</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
                color: #24292f;
                background: #ffffff;
              }

              h1 {
                margin-bottom: 8px;
              }

              p {
                color: #57606a;
              }

              ul {
                list-style: none;
                padding: 0;
              }

              li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
                padding: 14px;
                margin-bottom: 8px;
                border: 1px solid #d0d7de;
                border-radius: 6px;
              }

              a {
                color: #0969da;
                text-decoration: none;
                font-weight: 600;
                overflow-wrap: anywhere;
              }

              a:hover {
                text-decoration: underline;
              }

              .meta {
                color: #57606a;
                font-size: 14px;
                white-space: nowrap;
              }
            </style>
          </head>

          <body>
            <h1>Bases ND e BL</h1>
            <p>Arquivos JSON sincronizados automaticamente das Releases.</p>

            <ul>
          """

          page += "\n".join(items)

          page += """
            </ul>
          </body>
          </html>
          """

          output = folder / "index.html"
          output.write_text(page, encoding="utf-8")

          print(f"Index generated with {len(files)} JSON file(s).")
          print(f"Output: {output}")
          PY

      - name: Show generated files
        run: |
          echo "Files prepared for GitHub Pages:"
          find release-data -maxdepth 1 -type f -printf "%f - %s bytes\n"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: release-data

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
