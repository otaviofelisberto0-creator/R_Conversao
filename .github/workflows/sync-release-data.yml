name: Sync Release Data

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: sync-release-data-${{ github.repository }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync ND and BL from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          # List releases and iterate over non-draft, non-prerelease tags
          gh release list \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            echo "Processing release: $tag"

            # Download matching files into release-data; ignore errors if none found
