name: Sync Release Data

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: sync-release-data-${{ github.repository }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync ND and BL from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          # List releases and iterate over non-draft, non-prerelease tags
          gh release list \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
          | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            echo "Processing release: $tag"

            # Download matching files into release-data; ignore errors if none found
            gh release download "$tag" \
              --pattern 'nd-*.json' \
              --pattern 'bl-*.json' \
              --dir release-data \
              --clobber || true
          done

          echo "Files synchronized:"
          find release-data -maxdepth 1 -type f -print || true

          # Non-fatal presence checks: warn if missing, but continue to generate index and deploy
          nd_count=$(find release-data -maxdepth 1 -type f -name 'nd-*.json' -print -quit | wc -l)
          bl_count=$(find release-data -maxdepth 1 -type f -name 'bl-*.json' -print -quit | wc -l)

          if [ "$nd_count" -eq 0 ]; then
            echo "Warning: no nd-*.json files found in release-data"
          fi

          if [ "$bl_count" -eq 0 ]; then
            echo "Warning: no bl-*.json files found in release-data"
          fi

      - name: Generate index.html for release-data
        run: |
          set -euo pipefail
          INDEX_FILE=release-data/index.html

          cat > "$INDEX_FILE" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Release Data</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 2rem; }
              h1 { margin-bottom: 0.5rem; }
              ul { list-style: none; padding-left: 0; }
              li { margin: 0.4rem 0; }
              a { color: #0366d6; text-decoration: none; }
