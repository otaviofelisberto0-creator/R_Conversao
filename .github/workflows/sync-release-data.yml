name: Sync Release Data

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/sync-release-data.yml
  release:
    types: [published, edited, released]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download all complete monthly ND and BL pairs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-data
          mkdir -p release-data
          python3 <<'PY'
          import gzip, hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          output = Path('release-data')
          pattern = re.compile(r'^(nd|bl)[-_ ]+(?:20)?(\d{2})[-_ ]+(0[1-9]|1[0-2])\.json(?:\.gz)?$', re.I)

          def gh_json(endpoint):
              p = subprocess.run(['gh', 'api', '--paginate', endpoint], check=True, capture_output=True, text=True)
              text = p.stdout.strip()
              if not text:
                  return []
              # gh --paginate may concatenate JSON arrays.
              decoder = json.JSONDecoder(); pos = 0; values = []
              while pos < len(text):
                  while pos < len(text) and text[pos].isspace(): pos += 1
                  if pos >= len(text): break
                  value, pos = decoder.raw_decode(text, pos)
                  values.extend(value if isinstance(value, list) else [value])
              return values

          releases = [r for r in gh_json(f'repos/{repo}/releases?per_page=100') if not r.get('draft') and not r.get('prerelease')]
          if not releases:
              raise SystemExit('ERRO: nenhum Release publicado foi localizado.')

          candidates = {}
          for release in releases:
              assets = gh_json(f'repos/{repo}/releases/{release["id"]}/assets?per_page=100')
              release_time = release.get('published_at') or release.get('created_at') or ''
              for asset in assets:
                  m = pattern.fullmatch(asset.get('name', ''))
                  if not m or asset.get('state') != 'uploaded':
                      continue
                  kind, yy, mm = m.groups()
                  kind = kind.lower(); competence = f'{yy}-{mm}'
                  score = (release_time, asset.get('updated_at') or '', int(asset['id']))
                  key = (competence, kind)
                  if key not in candidates or score > candidates[key]['score']:
                      candidates[key] = {'score': score, 'asset': asset, 'tag': release.get('tag_name', '')}

          competences = sorted({c for c, _ in candidates})
          complete = [c for c in competences if (c, 'nd') in candidates and (c, 'bl') in candidates]
          incomplete = [c for c in competences if c not in complete]
          if not complete:
              raise SystemExit('ERRO: nenhum par mensal completo ND + BL foi localizado.')

          manifest_competences = {}
          sources = []
          revision = hashlib.sha256()
          for competence in complete:
              manifest_competences[competence] = {}
              for kind in ('nd', 'bl'):
                  selected = candidates[(competence, kind)]
                  asset = selected['asset']
                  tmp = output / f'.{asset["id"]}.tmp'
                  with tmp.open('wb') as stream:
                      subprocess.run([
                          'gh', 'api', f'repos/{repo}/releases/assets/{asset["id"]}',
                          '-H', 'Accept: application/octet-stream'
                      ], check=True, stdout=stream)
                  raw = tmp.read_bytes(); tmp.unlink()
                  if asset['name'].lower().endswith('.gz'):
                      raw = gzip.decompress(raw)
                  payload = json.loads(raw.decode('utf-8-sig'))
                  rows = payload if isinstance(payload, list) else payload.get('rows') if isinstance(payload, dict) else None
                  if not isinstance(rows, list) or not rows or not all(isinstance(row, dict) for row in rows):
                      raise SystemExit(f'ERRO: {asset["name"]} nao possui registros JSON validos.')
                  filename = f'{kind}-{competence}.json'
                  (output / filename).write_bytes(raw)
                  manifest_competences[competence][kind] = filename
                  revision.update(filename.encode()); revision.update(hashlib.sha256(raw).digest())
                  sources.append({'file': filename, 'rows': len(rows), 'release': selected['tag'], 'asset_id': asset['id']})
                  print(f'OK {filename}: {len(rows)} registros | release {selected["tag"]}')

          manifest = {
              'version': 1,
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'revision': revision.hexdigest(),
              'latest': complete[-1],
              'competences': manifest_competences,
              'sources': sources,
              'ignored_incomplete_competences': incomplete,
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print('COMPETENCIAS PUBLICADAS:', ', '.join(complete))
          print('COMPETENCIA MAIS RECENTE:', complete[-1])
          if incomplete: print('INCOMPLETAS IGNORADAS:', ', '.join(incomplete))
          PY

      - name: Validate single official index and Andira
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q '"COD_MUNICIPIO":"4101101"' index.html
          grep -q '"CIDADES":"Andirá"' index.html
          grep -Eq 'CONVERSAO[[:space:]]*:[[:space:]]*80' index.html
          grep -Eq 'INSTALACAO_48H[[:space:]]*:[[:space:]]*65' index.html
          grep -Eq 'INSTALACAO_3_DIAS[[:space:]]*:[[:space:]]*78' index.html
          test "$(grep -o 'async function loadGitHubReleaseAssets()' index.html | wc -l)" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('release-data/manifest.json').read_text(encoding='utf-8'))
          latest=manifest['latest']
          pair=manifest['competences'].get(latest, {})
          if set(pair) != {'nd','bl'}:
              raise SystemExit('ERRO: competencia mais recente sem par ND + BL.')
          print('Manifesto valido. Mais recente:', latest)
          PY

      - name: Copy exact official material to Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/release-data
          cp index.html _site/index.html
          cp -R release-data/. _site/release-data/
          if [ -d reference-data ]; then
            mkdir -p _site/reference-data
            cp -R reference-data/. _site/reference-data/
          fi
          touch _site/.nojekyll
          cmp -s index.html _site/index.html
          test -s _site/release-data/manifest.json
          echo 'OK: index publicado sem qualquer recriacao ou alteracao.'

      - name: Upload exact package for audit
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-oficial-unico
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
