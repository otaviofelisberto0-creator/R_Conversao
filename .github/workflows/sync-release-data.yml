name: Sync Release Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare dashboard and release data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download ND and BL files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-data
          mkdir -p release-data

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            > release-tags.txt

          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            echo "Processing release: $tag"

            gh release download "$tag" \
              --repo "${{ github.repository }}" \
              --pattern "nd-*.json" \
              --pattern "bl-*.json" \
              --dir release-data \
              --clobber || true

          done < release-tags.txt

          echo "Downloaded JSON files:"
          find release-data -maxdepth 1 -type f -name "*.json" -print

          json_count=$(find release-data -maxdepth 1 -type f -name "*.json" | wc -l)

          if [ "$json_count" -eq 0 ]; then
            echo "ERROR: No ND or BL JSON files found."
            exit 1
          fi

          echo "Total JSON files: $json_count"

      - name: Generate release manifest
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          folder = Path("release-data")

          pattern = re.compile(
              r"^(nd|bl)-(\d{2})-(\d{2})\.json$",
              re.IGNORECASE
          )

          competences = {}

          for file in sorted(folder.glob("*.json")):
              match = pattern.match(file.name)

              if not match:
                  continue

              file_type = match.group(1).lower()
              year = match.group(2)
              month = match.group(3)
              competence = f"{year}-{month}"

              if competence not in competences:
                  competences[competence] = {}

              competences[competence][file_type] = file.name

          if not competences:
              raise SystemExit(
                  "ERROR: No valid ND/BL files found for manifest."
              )

          complete = {
              competence: files
              for competence, files in competences.items()
              if "nd" in files and "bl" in files
          }

          if not complete:
              raise SystemExit(
                  "ERROR: No competence contains both ND and BL."
              )

          def competence_key(value):
              year, month = value.split("-")
              return int(year), int(month)

          latest = max(
              complete.keys(),
              key=competence_key
          )

          manifest = {
              "version": 1,
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "latest": latest,
              "competences": complete
          }

          output = folder / "manifest.json"

          output.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Manifest generated successfully.")
          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Validate release manifest
        run: |
          set -euo pipefail

          if [ ! -f "release-data/manifest.json" ]; then
            echo "ERROR: manifest.json was not generated."
            exit 1
          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          manifest_file = Path(
              "release-data/manifest.json"
          )

          manifest = json.loads(
              manifest_file.read_text(
                  encoding="utf-8"
              )
          )

          latest = manifest.get("latest")
          competences = manifest.get(
              "competences",
              {}
          )

          if not latest:
              raise SystemExit(
                  "ERROR: latest is missing."
              )

          if latest not in competences:
              raise SystemExit(
                  "ERROR: latest competence is missing."
              )

          latest_files = competences[latest]

          if "nd" not in latest_files:
              raise SystemExit(
                  "ERROR: latest ND file is missing."
              )

          if "bl" not in latest_files:
              raise SystemExit(
                  "ERROR: latest BL file is missing."
              )

          print(
              "Latest competence:",
              latest
          )

          print(
              "ND:",
              latest_files["nd"]
          )

          print(
              "BL:",
              latest_files["bl"]
          )
          PY

      - name: Prepare dashboard site
        run: |
          set -euo pipefail

          if [ ! -f "index.html" ]; then
            echo "ERROR: Dashboard index.html was not found."
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="release-data/" \
            --exclude="release-tags.txt" \
            ./ _site/

          mkdir -p _site/release-data

          cp -R release-data/. _site/release-data/

          touch _site/.nojekyll

          echo "Dashboard:"
          ls -lh _site/index.html

          echo "Release data:"
          ls -lh _site/release-data/

          if [ ! -f "_site/release-data/manifest.json" ]; then
            echo "ERROR: manifest.json was not copied."
            exit 1
          fi

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: dashboard index.html is missing."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
